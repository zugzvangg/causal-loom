name: Bug report
description: Report a reproducible problem in CausalLoom
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove secrets,
        personal data, and proprietary datasets from examples.

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest runnable example and synthetic input data.
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Error output
      description: Paste the complete traceback or other relevant output.
      render: shell

  - type: input
    id: package-version
    attributes:
      label: Package version or commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.5"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: My example does not contain sensitive or proprietary data.
          required: true
