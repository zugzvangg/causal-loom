[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-loom"
version = "0.1.0"
description = "Reusable causal-inference tools for synthetic control, difference-in-differences, and SDID"
readme = "README.md"
authors = [
    { name = "Dmitriy Bazanov" },
]
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
]
requires-python = ">=3.10.11"
keywords = [
    "causal-inference",
    "difference-in-differences",
    "econometrics",
    "experimentation",
    "synthetic-control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.2.2",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.1",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/zugzvangg/causal-loom"
Issues = "https://github.com/zugzvangg/causal-loom/issues"
Repository = "https://github.com/zugzvangg/causal-loom"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]
notebooks = [
    "notebook==7.5.5",
    "jupyter>=1.1.1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["causal_loom*"]
exclude = ["notebooks*", "tests*"]
namespaces = false

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["causal_loom"]

[tool.coverage.report]
fail_under = 75
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
